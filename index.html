<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ريحني — أقرب حمام عام ليك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --teal-dark:#10474C;
    --teal:#166A6E;
    --aqua:#35B0A7;
    --sand:#F2E9D8;
    --ink:#16242A;
    --amber:#E0A458;
    --white:#FFFFFF;
    --line:#DCD0B8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--sand);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
    line-height:1.6;
  }
  .wrap{max-width:640px; margin:0 auto; padding:0 20px 100px;}

  header.hero{
    background:var(--teal-dark);
    color:var(--white);
    padding:36px 20px 44px;
    border-radius:0 0 28px 28px;
    text-align:center;
  }
  header.hero h1{
    font-family:'Tajawal', sans-serif;
    font-weight:900;
    font-size:2.6rem;
    color:var(--white);
    letter-spacing:0.5px;
  }
  header.hero p{
    margin-top:10px;
    font-size:1.05rem;
    color:#CFE8E4;
    max-width:420px;
    margin-inline:auto;
  }

  .locate-btn{
    display:block;
    width:100%;
    max-width:420px;
    margin:24px auto 0;
    background:var(--amber);
    color:var(--teal-dark);
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:1.15rem;
    border:none;
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    transition:transform .12s ease;
  }
  .locate-btn:active{transform:scale(0.98);}
  .locate-btn:disabled{opacity:0.6; cursor:wait;}

  .status{
    text-align:center;
    font-size:0.95rem;
    color:var(--teal);
    margin-top:14px;
    min-height:1.2em;
  }

  #map{
    height:260px;
    border-radius:16px;
    margin-top:24px;
    border:1px solid var(--line);
    display:none;
  }

  section.list{margin-top:28px;}
  section.list h2{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:1.2rem;
    color:var(--teal-dark);
    margin-bottom:12px;
  }

  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    margin-bottom:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
  }
  .card .info h3{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    color:var(--ink);
  }
  .card .info p{
    font-size:0.88rem;
    color:#5B6A6C;
    margin-top:2px;
  }
  .card .dist{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    color:var(--teal);
    font-size:0.95rem;
    white-space:nowrap;
  }
  .card a.go{
    display:inline-block;
    margin-top:6px;
    font-size:0.85rem;
    color:var(--aqua);
    text-decoration:none;
    font-weight:600;
  }

  .empty{
    text-align:center;
    color:#5B6A6C;
    padding:30px 10px;
    font-size:0.95rem;
  }

  .fab{
    position:fixed;
    left:20px;
    bottom:20px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:var(--teal-dark);
    color:var(--white);
    font-size:1.8rem;
    border:none;
    box-shadow:0 6px 18px rgba(16,71,76,0.35);
    cursor:pointer;
    z-index: 1000;
  }

  .modal-bg{
    display:none;
    position:fixed; inset:0;
    background:rgba(22,36,42,0.55);
    align-items:flex-end;
    justify-content:center;
    z-index:1001;
  }
  .modal-bg.open{display:flex;}
  .modal{
    background:var(--white);
    width:100%;
    max-width:640px;
    border-radius:20px 20px 0 0;
    padding:24px 20px 28px;
  }
  .modal h3{
    font-family:'Tajawal', sans-serif;
    font-weight:700;
    font-size:1.2rem;
    color:var(--teal-dark);
    margin-bottom:14px;
  }
  .modal label{
    display:block;
    font-size:0.88rem;
    color:#5B6A6C;
    margin-bottom:6px;
  }
  .modal input, .modal textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    font-family:inherit;
    font-size:0.95rem;
    margin-bottom:14px;
    background:var(--sand);
  }
  .modal .row{display:flex; gap:10px;}
  .modal .row button{flex:1;}
  .btn-primary{
    background:var(--teal-dark);
    color:var(--white);
    border:none;
    border-radius:10px;
    padding:12px;
    font-weight:700;
    font-family:'Tajawal', sans-serif;
    cursor:pointer;
  }
  .btn-secondary{
    background:transparent;
    color:var(--teal-dark);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px;
    font-weight:700;
    font-family:'Tajawal', sans-serif;
    cursor:pointer;
  }
  .hint{font-size:0.8rem; color:#8A8060; margin-top:-6px; margin-bottom:14px;}
</style>
</head>
<body>

<header class="hero">
  <h1>ريحني</h1>
  <p>محتاج حمام دلوقتي؟ اضغط الزر وشوف أقرب حمام عام ليك.</p>
  <button class="locate-btn" id="locateBtn">📍 وين أقرب حمام مني؟</button>
  <div class="status" id="status"></div>
</header>

<div class="wrap">
  <div id="map"></div>

  <section class="list">
    <h2 id="listTitle">الحمامات المضافة</h2>
    <div id="listContainer"></div>
  </section>
</div>

<button class="fab" id="addFab" title="أضف حمام">+</button>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>إضافة حمام جديد</h3>
    <label for="name">اسم المكان</label>
    <input id="name" type="text" placeholder="مثال: محطة بنزين شرق كسلا">
    <div class="hint" id="coordHint">سيتم تحديد الإحداثيات للمكان المختار</div>
    <label for="notes">ملاحظات (اختياري)</label>
    <textarea id="notes" rows="2" placeholder="مثال: مجاني، متاح ٢٤ ساعة"></textarea>
    <div class="row">
      <button class="btn-secondary" id="cancelAdd">إلغاء</button>
      <button class="btn-primary" id="saveAdd">حفظ</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'restrooms_list';
let userLat = null, userLng = null;
let selectedLat = null, selectedLng = null;
let map = null, markersLayer = null, tempMarker = null;
let restrooms = [];

function haversine(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLng = (lng2-lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function fmtDist(km){
  if(km < 1) return Math.round(km*1000) + ' م';
  return km.toFixed(1) + ' كم';
}

function loadRestrooms(){
  try{
    const res = localStorage.getItem(STORAGE_KEY);
    restrooms = res ? JSON.parse(res) : [];
  }catch(e){
    restrooms = [];
  }
}

function saveRestrooms(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(restrooms));
}

function renderList(){
  const container = document.getElementById('listContainer');
  const title = document.getElementById('listTitle');
  container.innerHTML = '';

  if(restrooms.length === 0){
    container.innerHTML = '<div class="empty">لسه ما فيه حمامات مضافة. كن أول واحد يضيف!</div>';
    return;
  }

  let sorted = [...restrooms];
  if(userLat !== null){
    sorted.forEach(r => r._dist = haversine(userLat, userLng, r.lat, r.lng));
    sorted.sort((a,b) => a._dist - b._dist);
    title.textContent = 'أقرب الحمامات ليك';
  } else {
    title.textContent = 'الحمامات المضافة';
  }

  sorted.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    const gmaps = `https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`;
    card.innerHTML = `
      <div class="info">
        <h3>${escapeHtml(r.name)}</h3>
        ${r.notes ? `<p>${escapeHtml(r.notes)}</p>` : ''}
        <a class="go" href="${gmaps}" target="_blank" rel="noopener">🧭 وديني هناك</a>
      </div>
      ${r._dist !== undefined ? `<div class="dist">${fmtDist(r._dist)}</div>` : ''}
    `;
    container.appendChild(card);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function initMap(initialLat = 15.45, initialLng = 36.40, zoom = 12){
  const mapEl = document.getElementById('map');
  mapEl.style.display = 'block';
  if(!map){
    map = L.map('map').setView([initialLat, initialLng], zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    markersLayer = L.layerGroup().addTo(map);

    // السماح بنقر الخريطة لاختيار موقع الحمام
    map.on('click', (e) => {
      openAddModalWithCoords(e.latlng.lat, e.latlng.lng);
    });
  } else {
    map.setView([initialLat, initialLng], zoom);
  }
  updateMarkers();
}

function updateMarkers(){
  if(!map) return;
  markersLayer.clearLayers();
  if(userLat !== null){
    L.circleMarker([userLat, userLng], {radius:8, color:'#E0A458', fillColor:'#E0A458', fillOpacity:1})
      .addTo(markersLayer).bindPopup('موقعك الحالي');
  }
  restrooms.forEach(r => {
    L.marker([r.lat, r.lng]).addTo(markersLayer).bindPopup(escapeHtml(r.name));
  });
}

document.getElementById('locateBtn').addEventListener('click', () => {
  const btn = document.getElementById('locateBtn');
  const status = document.getElementById('status');
  if(!navigator.geolocation){
    status.textContent = 'المتصفح ما بيدعم تحديد الموقع';
    return;
  }
  btn.disabled = true;
  status.textContent = 'جاري تحديد موقعك...';
  navigator.geolocation.getCurrentPosition((pos) => {
    userLat = pos.coords.latitude;
    userLng = pos.coords.longitude;
    status.textContent = 'تم تحديد موقعك';
    btn.disabled = false;
    initMap(userLat, userLng, 14);
    renderList();
  }, (err) => {
    status.textContent = 'ما قدرنا نحدد موقعك — يمكنك اختيار الموقع مباشرة من الخريطة';
    btn.disabled = false;
    initMap(); // فتح الخريطة بالموقع الافتراضي
  }, {enableHighAccuracy:true, timeout:10000});
});

const modalBg = document.getElementById('modalBg');
const addFab = document.getElementById('addFab');
const coordHint = document.getElementById('coordHint');

function openAddModalWithCoords(lat, lng){
  selectedLat = lat;
  selectedLng = lng;
  coordHint.textContent = `سيتم إضافة المكان بالحديثات (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
  modalBg.classList.add('open');
}

addFab.addEventListener('click', () => {
  if(userLat !== null){
    openAddModalWithCoords(userLat, userLng);
  } else {
    // فتح الخريطة للتحديد اليدوي
    initMap();
    document.getElementById('status').textContent = 'اضغط على أي نقطة في الخريطة لإضافة حمام هناك';
    window.scrollTo({ top: document.getElementById('map').offsetTop - 20, behavior: 'smooth' });
  }
});

document.getElementById('cancelAdd').addEventListener('click', () => {
  modalBg.classList.remove('open');
});

document.getElementById('saveAdd').addEventListener('click', () => {
  const name = document.getElementById('name').value.trim();
  const notes = document.getElementById('notes').value.trim();
  if(!name){
    alert('من فضلك اكتب اسم المكان');
    return;
  }
  const newEntry = {
    id: Date.now().toString(),
    name, notes,
    lat: selectedLat, lng: selectedLng,
    addedAt: new Date().toISOString()
  };
  restrooms.push(newEntry);
  saveRestrooms();
  document.getElementById('name').value = '';
  document.getElementById('notes').value = '';
  modalBg.classList.remove('open');
  renderList();
  if(map) updateMarkers();
});

function init(){
  loadRestrooms();
  renderList();
}
init();
</script>

</body>
</html>
